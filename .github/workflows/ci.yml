name: CI

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
      - 'fp*'
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Build Next.js Production
        run: npm run build
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy?sslmode=disable"
          DATABASE_URL_UNPOOLED: "postgresql://dummy:dummy@localhost:5432/dummy?sslmode=disable"
          BETTER_AUTH_SECRET: "ci-dummy-secret-key-at-least-32-chars-long"
          BETTER_AUTH_URL: "http://localhost:3000"
